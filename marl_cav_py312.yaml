# Python 3.12 environment for MARL-MASS (e.g. run_mappo.py).
#   conda env create -f marl_cav_py312.yaml
#   conda activate marl_cav_py312
name: marl_cav_py312
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.12
  - pip
  - pip:
    # CUDA 12.1 build of PyTorch (CUDA runtime bundled in the wheels, needs NVIDIA driver >= 525)
    - --extra-index-url https://download.pytorch.org/whl/cu121
    - torch==2.5.1+cu121
    # gym 0.26.2 does not support NumPy 2
    - numpy==1.26.4
    - gym==0.26.2
    - pandas==2.2.3
    - matplotlib==3.9.4
    - opencv-python==4.10.0.84
    - pygame==2.6.1
    - cvxopt==1.3.2
    - control==0.10.1
    - scipy==1.14.1
    - wandb==0.28.2
